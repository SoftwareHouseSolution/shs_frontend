# Production: Next.js (`next start`). Settings come from .env next to this file. Only
# publishes on 127.0.0.1 for the host nginx.
name: shs-frontend

services:
  web:
    build:
      context: .
      # `npm run build` prerenders every page from the API. On the host's network the build
      # resolves and reaches the API exactly as the host does; on Docker's build network it
      # can fail to resolve the domain (ENOTFOUND) or to reach the server's own public IP.
      network: host
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:?set NEXT_PUBLIC_API_URL in .env}
        NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:?set NEXT_PUBLIC_SITE_URL in .env}
    restart: unless-stopped
    env_file: .env
    ports:
      - "127.0.0.1:${WEB_PORT:-8330}:3000"
